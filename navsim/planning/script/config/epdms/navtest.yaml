benchmark: navtest
expected_scenes: 12146
traffic_agents: non_reactive
metric_cache_path: ${oc.env:NAVSIM_CACHE_ROOT}/navtest_metric_cache_v2
map_root: ${oc.env:NUPLAN_MAPS_ROOT}
proposal_sampling:
  _target_: nuplan.planning.simulation.trajectory.trajectory_sampling.TrajectorySampling
  _convert_: all
  num_poses: 40
  interval_length: 0.1
simulator:
  _target_: navsim.v2.planning.simulation.planner.pdm_planner.simulation.pdm_simulator.PDMSimulator
  proposal_sampling: ${proposal_sampling}
scorer:
  _target_: navsim.v2.planning.simulation.planner.pdm_planner.scoring.pdm_scorer.PDMScorer
  _convert_: all
  proposal_sampling: ${proposal_sampling}
  config:
    _target_: navsim.v2.planning.simulation.planner.pdm_planner.scoring.pdm_scorer.PDMScorerConfig
    _convert_: all
    progress_weight: 5.0
    ttc_weight: 5.0
    lane_keeping_weight: 2.0
    history_comfort_weight: 2.0
    two_frame_extended_comfort_weight: 2.0
    driving_direction_horizon: 1.0
    driving_direction_compliance_threshold: 2.0
    driving_direction_violation_threshold: 6.0
    stopped_speed_threshold: 5e-03
    future_collision_horizon_window: 1.0
    progress_distance_threshold: 5.0
    lane_keeping_deviation_limit: 0.5
    lane_keeping_horizon_window: 2.0
    human_penalty_filter: true
traffic_agents_policy:
  non_reactive:
    _target_: navsim.v2.traffic_agents_policies.log_replay_traffic_agents.LogReplayTrafficAgents
    _convert_: all
  reactive:
    _target_: navsim.v2.traffic_agents_policies.navsim_IDM_traffic_agents.NavsimIDMTrafficAgents
    _convert_: all
    idm_agents_observation:
      _target_: navsim.v2.planning.simulation.observation.navsim_idm_agents.NavsimIDMAgents
      _convert_: all
      target_velocity: 10
      min_gap_to_lead_agent: 1.0
      headway_time: 1.5
      accel_max: 1.0
      decel_max: 2.0
      open_loop_detections_types: []
      minimum_path_length: 20
      planned_trajectory_samples: null
      planned_trajectory_sample_interval: null
      radius: 100
      add_open_loop_parked_vehicles: true
      idm_snap_threshold: 3.0
    map_root_override: ${map_root}
