# DriveSTA training recipe. Shared model parameters: ../common/agent/drivesta_proposal.yaml
hydra:
  run:
    dir: ${output_dir}
  output_subdir: ${output_dir}/code/hydra
  searchpath:
  - pkg://navsim.planning.script.config.common
  job:
    chdir: false
defaults:
- default_common
- default_evaluation
- default_train_val_test_log_split
- agent: drivesta_proposal
- _self_
split: trainval
cache_path: null
use_cache_without_dataset: false
force_cache_computation: false
experiment_name: drivesta_scale_proposal
seed: 2
validation_run: false
dataloader:
  params:
    batch_size: 6
    num_workers: 10
    pin_memory: false
    prefetch_factor: 2
trainer:
  params:
    max_epochs: 25
    check_val_every_n_epoch: 1
    val_check_interval: 1.0
    limit_train_batches: 1.0
    limit_val_batches: 0.0
    accelerator: gpu
    devices: 8
    strategy: ddp_find_unused_parameters_true
    precision: bf16-mixed
    use_distributed_sampler: false
    num_nodes: 1
    num_sanity_val_steps: 0
    fast_dev_run: false
    accumulate_grad_batches: 1
    gradient_clip_val: 1.0
    gradient_clip_algorithm: norm
    log_every_n_steps: 10
    default_root_dir: ${output_dir}
train_ckpt_path: null
output_dir: ${oc.env:NAVSIM_EXP_ROOT}/scale_proposal/${now:%Y%m%d_%H%M%S}
feedback:
  training_split: trainval
  index_path: ${oc.env:DRIVESTA_ROOT}/data/indexes/drivesta/mixed.json
  replay_samples: 64
  auxiliary_samples: 8
  auxiliary_bank_capacity: 32
  expected_trainval_scenes: 232672
  expected_train_scenes: 85089
  online_workers: 4
  limit_train_scenes: null
  limit_val_scenes: null
  official_cache_root: ${oc.env:OFFICIAL_PDM_CACHE,${oc.env:DRIVESTA_ROOT}/data/navsim_cache/official_metric_cache_v1}
  validation_oracle: false
preflight_only: false
agent:
  config:
    vlm_feature_cache_path: null
    image_backbone:
      model_weights: ${oc.env:DRIVESTA_BACKBONE_ROOT,${oc.env:DRIVESTA_ROOT}/weights/Backbones}/dinov2/model.safetensors
    lidar_backbone:
      model_weights: ${oc.env:DRIVESTA_BACKBONE_ROOT,${oc.env:DRIVESTA_ROOT}/weights/Backbones}/dinov2/model.safetensors
  loss:
    rank_weight: 0.05
    mask_unavailable_long_gt: true
  lr_args:
    base_lr: 0.0002
  scheduler_args:
    dataset_size: 232672
  batch_size: 6
training_mode: proposal
data_profile: mixed
