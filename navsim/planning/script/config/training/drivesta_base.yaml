# DriveSTA training recipe. Shared model parameters: ../common/agent/drivesta.yaml
hydra:
  run:
    dir: ${output_dir}
  output_subdir: ${output_dir}/code/hydra
  searchpath:
  - pkg://navsim.planning.script.config.common
  job:
    chdir: false
defaults:
- default_common
- default_evaluation
- default_train_val_test_log_split
- agent: drivesta
- _self_
split: trainval
cache_path: null
use_cache_without_dataset: false
force_cache_computation: false
experiment_name: drivesta_base
seed: 2
validation_run: false
preflight_only: false
dataloader:
  params:
    batch_size: 6
    num_workers: 10
    pin_memory: false
    prefetch_factor: 2
trainer:
  params:
    max_epochs: 40
    check_val_every_n_epoch: 1
    val_check_interval: 1.0
    limit_train_batches: 1.0
    limit_val_batches: 0.0
    accelerator: gpu
    devices: 8
    strategy: ddp_find_unused_parameters_true
    precision: bf16-mixed
    use_distributed_sampler: false
    num_nodes: 1
    num_sanity_val_steps: 0
    fast_dev_run: false
    accumulate_grad_batches: 1
    gradient_clip_val: 1.0
    gradient_clip_algorithm: norm
    log_every_n_steps: 10
    default_root_dir: ${output_dir}
train_ckpt_path: null
output_dir: ${oc.env:NAVSIM_EXP_ROOT}/base/${now:%Y%m%d_%H%M%S}
feedback:
  training_split: trainval
  index_path: ${oc.env:DRIVESTA_ROOT}/data/indexes/drivesta/proposals.json
  history_index: ${oc.env:DRIVESTA_ROOT}/data/indexes/drivesta/history.json
  future_index: ${oc.env:DRIVESTA_ROOT}/data/indexes/drivesta/future.json
  replay_samples: 64
  auxiliary_samples: 32
  auxiliary_bank_capacity: 32
  expected_trainval_scenes: 103263
  expected_train_scenes: 85089
  online_workers: 12
  online_chunk_size: 32
  limit_train_scenes: null
  limit_val_scenes: null
  official_cache_root: ${oc.env:OFFICIAL_PDM_CACHE,${oc.env:DRIVESTA_ROOT}/data/navsim_cache/official_metric_cache_v1}
  validation_oracle: false
agent:
  config:
    jepa_checkpoint: ${oc.env:DRIVESTA_BACKBONE_ROOT,${oc.env:DRIVESTA_ROOT}/weights/Backbones}/drive_jepa/vitl_merge_3dataset_e50.pt
    jepa_encoder_lr: 1.0e-05
    jepa_predictor_lr: 0.0001
    image_backbone:
      model_weights: ${oc.env:DRIVESTA_BACKBONE_ROOT,${oc.env:DRIVESTA_ROOT}/weights/Backbones}/dinov2/model.safetensors
    lidar_backbone:
      model_weights: ${oc.env:DRIVESTA_BACKBONE_ROOT,${oc.env:DRIVESTA_ROOT}/weights/Backbones}/dinov2/model.safetensors
  loss:
    phase: joint
  lr_args:
    base_lr: 0.0002
  batch_size: 6
training_mode: refinement
data_profile: real
