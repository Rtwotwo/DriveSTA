[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 100
target-version = ["py39"]
extend-exclude = "(/nuplan-devkit/|/jepa_vendor/)"

[tool.ruff]
line-length = 100
target-version = "py39"
exclude = ["nuplan-devkit", "**/jepa_vendor/**"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.pytest.ini_options]
pythonpath = [".", "feedback/src", "nuplan-devkit"]
testpaths = ["tests", "feedback/tests"]
addopts = "--import-mode=importlib"
