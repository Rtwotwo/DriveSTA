[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "drivesta-feedback"
version = "0.1.0"
description = "DriveSTA constrained trajectory mining and scored supervision"
requires-python = ">=3.9"
dependencies = ["PyYAML", "numpy", "scipy", "matplotlib", "torch"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
