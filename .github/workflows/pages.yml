name: Deploy project page
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build static project page
        run: python tools/build_site.py
      - name: Verify local asset references and README buttons
        run: python tools/check_site.py --site-root _site
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Wait for Pages artifact visibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.request
          url = (f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}"
                 f"/actions/runs/{os.environ['GITHUB_RUN_ID']}/artifacts?name=github-pages")
          request = urllib.request.Request(url, headers={
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              "Accept": "application/vnd.github+json",
          })
          for attempt in range(12):
              with urllib.request.urlopen(request, timeout=20) as response:
                  artifacts = json.load(response)["artifacts"]
              ready = [a for a in artifacts if a["name"] == "github-pages" and not a["expired"]]
              if ready:
                  print(f"Pages artifact is ready: {ready[0]['id']}")
                  time.sleep(5)
                  break
              print(f"Waiting for artifact indexing ({attempt + 1}/12)", flush=True)
              time.sleep(5)
          else:
              raise SystemExit("The uploaded Pages artifact is still unavailable after 60 seconds.")
          PY
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
